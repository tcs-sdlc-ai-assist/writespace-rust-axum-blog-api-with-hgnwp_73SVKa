<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - WriteSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;padding:0 1.5rem;height:64px}
        .nav-brand{font-size:1.25rem;font-weight:700;color:#6366f1;text-decoration:none}
        .nav-links{display:flex;align-items:center;gap:1rem}
        .nav-link{color:#6b7280;text-decoration:none;font-size:0.9rem;font-weight:500;padding:0.25rem 0.5rem;border-radius:0.375rem;transition:color 0.15s,background 0.15s}
        .nav-link:hover{color:#6366f1;background:#f3f4f6}
        .nav-link.active{color:#6366f1;background:#eef2ff}
        .nav-user{display:flex;align-items:center;gap:0.75rem;margin-left:1rem;padding-left:1rem;border-left:1px solid #e5e7eb}
        .nav-user-info{display:flex;flex-direction:column;align-items:flex-start}
        .nav-user-name{font-size:0.85rem;font-weight:600;color:#1f2937}
        .nav-logout-btn{background:none;border:1px solid #e5e7eb;border-radius:0.375rem;padding:0.35rem;cursor:pointer;color:#6b7280;transition:color 0.15s,border-color 0.15s}
        .nav-logout-btn:hover{color:#ef4444;border-color:#ef4444}
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav id="main-nav" class="bg-white border-b border-gray-200 sticky top-0 z-50"></nav>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Admin Dashboard</h1>
                <p class="text-gray-500 mt-1 text-sm">Manage your WriteSpace platform</p>
            </div>
            <a href="/admin-users.html" class="inline-flex items-center gap-2 bg-indigo-500 hover:bg-indigo-600 text-white font-semibold text-sm px-5 py-2.5 rounded-lg transition-colors shadow-sm">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Manage Users
            </a>
        </div>

        <div id="stats-container">
            <div class="flex justify-center items-center py-20">
                <div class="w-8 h-8 border-3 border-gray-200 border-t-indigo-500 rounded-full" style="border-width:3px;animation:spin 0.8s linear infinite;"></div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
    (function() {
        "use strict";

        if (!App.requireAdmin()) return;

        App.renderNav("admin");

        loadStats();

        function loadStats() {
            var container = document.getElementById("stats-container");

            App.apiFetch("/api/admin/stats")
                .then(function(result) {
                    renderStats(container, result.data);
                })
                .catch(function(err) {
                    App.showError(container, (err && err.error) || "Failed to load dashboard stats");
                });
        }

        function renderStats(container, stats) {
            var html = "";

            html += '<div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">';

            html += renderStatCard(
                "Total Posts",
                stats.total_posts,
                "bg-blue-50",
                "text-blue-600",
                '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>'
            );

            html += renderStatCard(
                "Total Users",
                stats.total_users,
                "bg-green-50",
                "text-green-600",
                '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
            );

            html += renderStatCard(
                "Total Admins",
                stats.total_admins,
                "bg-rose-50",
                "text-rose-600",
                '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>'
            );

            html += "</div>";

            html += '<div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">';
            html += '<div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">';
            html += '<h2 class="text-lg font-semibold text-gray-900">Recent Posts</h2>';
            html += '<a href="/blogs.html" class="text-sm text-indigo-500 hover:text-indigo-600 font-medium transition-colors">View all &rarr;</a>';
            html += "</div>";

            if (stats.recent_posts && stats.recent_posts.length > 0) {
                html += '<div class="divide-y divide-gray-100">';
                for (var i = 0; i < stats.recent_posts.length; i++) {
                    var post = stats.recent_posts[i];
                    html += '<div class="px-6 py-4 flex items-center justify-between hover:bg-gray-50 transition-colors">';
                    html += '<div class="flex-1 min-w-0">';
                    html += '<a href="/post.html?id=' + App.escapeHtml(post.id) + '" class="text-sm font-medium text-gray-900 hover:text-indigo-600 transition-colors truncate block">' + App.escapeHtml(post.title) + '</a>';
                    html += '<p class="text-xs text-gray-400 mt-0.5">' + App.formatDate(post.created_at) + '</p>';
                    html += "</div>";
                    html += '<a href="/post.html?id=' + App.escapeHtml(post.id) + '" class="ml-4 text-xs text-indigo-500 hover:text-indigo-600 font-medium flex-shrink-0 transition-colors">View</a>';
                    html += "</div>";
                }
                html += "</div>";
            } else {
                html += '<div class="px-6 py-12 text-center text-gray-400">';
                html += '<p class="text-sm">No posts yet. Create your first post!</p>';
                html += "</div>";
            }

            html += "</div>";

            container.innerHTML = html;
        }

        function renderStatCard(label, value, bgClass, textClass, iconSvg) {
            var html = "";
            html += '<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex items-center gap-4">';
            html += '<div class="flex-shrink-0 w-14 h-14 rounded-lg flex items-center justify-center ' + bgClass + " " + textClass + '">';
            html += iconSvg;
            html += "</div>";
            html += '<div>';
            html += '<p class="text-sm font-medium text-gray-500">' + App.escapeHtml(label) + "</p>";
            html += '<p class="text-2xl font-bold text-gray-900 mt-0.5">' + App.escapeHtml(String(value)) + "</p>";
            html += "</div>";
            html += "</div>";
            return html;
        }
    })();
    </script>
</body>
</html>
