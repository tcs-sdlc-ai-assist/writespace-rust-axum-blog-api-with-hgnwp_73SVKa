<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post - WriteSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; height: 64px; }
        .nav-brand { font-size: 1.25rem; font-weight: 700; color: #6366f1; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 1rem; }
        .nav-link { color: #6b7280; text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 0.25rem 0.5rem; border-radius: 0.375rem; transition: color 0.15s, background 0.15s; }
        .nav-link:hover { color: #6366f1; background: #eef2ff; }
        .nav-link.active { color: #6366f1; background: #eef2ff; }
        .nav-user { display: flex; align-items: center; gap: 0.75rem; }
        .nav-user-info { display: flex; flex-direction: column; align-items: flex-start; }
        .nav-user-name { font-size: 0.85rem; font-weight: 600; color: #1f2937; }
        .nav-logout-btn { background: none; border: 1px solid #e5e7eb; border-radius: 0.375rem; padding: 0.35rem; cursor: pointer; color: #6b7280; transition: color 0.15s, border-color 0.15s; display: flex; align-items: center; justify-content: center; }
        .nav-logout-btn:hover { color: #ef4444; border-color: #fca5a5; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav id="main-nav" class="bg-white border-b border-gray-200 sticky top-0 z-50"></nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 py-8">
        <div id="post-container">
            <div class="flex justify-center items-center py-20">
                <div class="w-8 h-8 border-3 border-gray-200 border-t-indigo-500 rounded-full" style="border-width:3px;border-top-color:#6366f1;animation:spin 0.8s linear infinite;"></div>
            </div>
        </div>
    </main>

    <div id="delete-modal" class="fixed inset-0 z-50 hidden">
        <div class="fixed inset-0 bg-black bg-opacity-50" id="delete-modal-overlay"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative z-10">
                <h3 class="text-lg font-bold text-gray-900 mb-2">Delete Post</h3>
                <p class="text-gray-600 mb-6">Are you sure you want to delete this post? This action cannot be undone.</p>
                <div class="flex justify-end gap-3">
                    <button id="delete-cancel-btn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
                    <button id="delete-confirm-btn" class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
    (function() {
        "use strict";

        App.renderNav("blogs");

        var params = new URLSearchParams(window.location.search);
        var postId = params.get("id");

        if (!postId) {
            showPostError("No post ID provided.");
            return;
        }

        var currentPost = null;

        function showPostError(message) {
            var container = document.getElementById("post-container");
            container.innerHTML =
                '<div class="text-center py-20">' +
                    '<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-100 mb-4">' +
                        '<svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>' +
                    '</div>' +
                    '<p class="text-gray-600 text-lg mb-4">' + App.escapeHtml(message) + '</p>' +
                    '<a href="/blogs.html" class="inline-flex items-center gap-2 text-indigo-600 hover:text-indigo-700 font-medium">' +
                        '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>' +
                        'Back to Blogs' +
                    '</a>' +
                '</div>';
        }

        function renderPost(post) {
            currentPost = post;
            var container = document.getElementById("post-container");

            var html = '';

            html += '<div class="mb-6">';
            html += '<a href="/blogs.html" class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-indigo-600 transition-colors">';
            html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>';
            html += 'Back to Blogs';
            html += '</a>';
            html += '</div>';

            html += '<article class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">';

            html += '<div class="p-6 sm:p-8">';

            html += '<h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-4">' + App.escapeHtml(post.title) + '</h1>';

            html += '<div class="flex items-center gap-3 mb-6 pb-6 border-b border-gray-100">';
            html += App.renderAvatar(post.author.display_name, post.author.role, 40);
            html += '<div class="flex flex-col">';
            html += '<div class="flex items-center gap-2">';
            html += '<span class="font-semibold text-gray-900 text-sm">' + App.escapeHtml(post.author.display_name) + '</span>';
            html += App.getRoleBadge(post.author.role);
            html += '</div>';
            html += '<span class="text-xs text-gray-500 mt-0.5">' + App.formatDateTime(post.created_at) + '</span>';
            html += '</div>';
            html += '</div>';

            html += '<div class="prose prose-gray max-w-none">';
            html += formatContent(post.content);
            html += '</div>';

            if (post.can_edit || post.can_delete) {
                html += '<div class="flex items-center gap-3 mt-8 pt-6 border-t border-gray-100">';
                if (post.can_edit) {
                    html += '<a href="/edit-post.html?id=' + encodeURIComponent(post.id) + '" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-indigo-600 bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors">';
                    html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>';
                    html += 'Edit Post';
                    html += '</a>';
                }
                if (post.can_delete) {
                    html += '<button onclick="handleDelete()" class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition-colors">';
                    html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>';
                    html += 'Delete Post';
                    html += '</button>';
                }
                html += '</div>';
            }

            html += '</div>';
            html += '</article>';

            container.innerHTML = html;

            document.title = post.title + ' - WriteSpace';
        }

        function formatContent(content) {
            if (!content) return '';
            var escaped = App.escapeHtml(content);
            var paragraphs = escaped.split(/\n\n+/);
            var html = '';
            for (var i = 0; i < paragraphs.length; i++) {
                var p = paragraphs[i].trim();
                if (p) {
                    p = p.replace(/\n/g, '<br>');
                    html += '<p class="mb-4 text-gray-700 leading-relaxed">' + p + '</p>';
                }
            }
            return html;
        }

        function fetchPost() {
            App.apiFetch('/api/posts/' + encodeURIComponent(postId))
                .then(function(result) {
                    renderPost(result.data);
                })
                .catch(function(err) {
                    if (err && err.status === 404) {
                        showPostError("Post not found.");
                    } else {
                        var message = (err && err.error) ? err.error : "Failed to load post.";
                        showPostError(message);
                    }
                });
        }

        window.handleDelete = function() {
            var modal = document.getElementById("delete-modal");
            modal.classList.remove("hidden");
        };

        document.getElementById("delete-cancel-btn").addEventListener("click", function() {
            document.getElementById("delete-modal").classList.add("hidden");
        });

        document.getElementById("delete-modal-overlay").addEventListener("click", function() {
            document.getElementById("delete-modal").classList.add("hidden");
        });

        document.getElementById("delete-confirm-btn").addEventListener("click", function() {
            var btn = document.getElementById("delete-confirm-btn");
            btn.disabled = true;
            btn.textContent = "Deleting...";

            App.apiFetch('/api/posts/' + encodeURIComponent(postId), {
                method: 'DELETE'
            })
            .then(function() {
                App.showToast("Post deleted successfully.", "success");
                setTimeout(function() {
                    window.location.href = "/blogs.html";
                }, 500);
            })
            .catch(function(err) {
                var message = (err && err.error) ? err.error : "Failed to delete post.";
                App.showToast(message, "error");
                btn.disabled = false;
                btn.textContent = "Delete";
                document.getElementById("delete-modal").classList.add("hidden");
            });
        });

        fetchPost();
    })();
    </script>
</body>
</html>
