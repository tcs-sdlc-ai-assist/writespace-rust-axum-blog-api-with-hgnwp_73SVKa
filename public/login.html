<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — WriteSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/app.js"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">
    <nav id="main-nav" class="bg-white border-b border-gray-200 px-4 py-3"></nav>

    <main class="flex items-center justify-center px-4 py-16">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-bold text-gray-900">Welcome back</h1>
                    <p class="mt-2 text-sm text-gray-500">Sign in to your WriteSpace account</p>
                </div>

                <div id="error-message" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"></div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            autocomplete="username"
                            placeholder="Enter your username"
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition"
                        />
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition"
                        />
                    </div>

                    <button
                        type="submit"
                        id="submit-btn"
                        class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 text-white font-semibold text-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        Sign In
                    </button>
                </form>

                <p class="mt-6 text-center text-sm text-gray-500">
                    Don't have an account?
                    <a href="/register.html" class="font-medium text-indigo-600 hover:text-indigo-500 transition">Register</a>
                </p>
            </div>
        </div>
    </main>

    <script>
        (function () {
            "use strict";

            if (App.isLoggedIn()) {
                window.location.href = "/blogs.html";
                return;
            }

            App.renderNav("login");

            var form = document.getElementById("login-form");
            var usernameInput = document.getElementById("username");
            var passwordInput = document.getElementById("password");
            var submitBtn = document.getElementById("submit-btn");
            var errorMessage = document.getElementById("error-message");

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.classList.remove("hidden");
            }

            function hideError() {
                errorMessage.textContent = "";
                errorMessage.classList.add("hidden");
            }

            function setLoading(loading) {
                submitBtn.disabled = loading;
                submitBtn.textContent = loading ? "Signing in…" : "Sign In";
            }

            form.addEventListener("submit", function (e) {
                e.preventDefault();
                hideError();

                var username = usernameInput.value.trim();
                var password = passwordInput.value;

                if (!username) {
                    showError("Username is required.");
                    usernameInput.focus();
                    return;
                }

                if (!password) {
                    showError("Password is required.");
                    passwordInput.focus();
                    return;
                }

                setLoading(true);

                App.apiFetch("/api/auth/login", {
                    method: "POST",
                    body: { username: username, password: password },
                })
                    .then(function (result) {
                        App.setToken(result.data.token);
                        App.showToast("Welcome back, " + App.escapeHtml(result.data.user.display_name) + "!", "success");
                        window.location.href = "/blogs.html";
                    })
                    .catch(function (err) {
                        setLoading(false);
                        var msg = (err && err.error) ? err.error : "Login failed. Please try again.";
                        showError(msg);
                    });
            });
        })();
    </script>

    <style>
        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #4f46e5;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .nav-link {
            font-size: 0.875rem;
            color: #6b7280;
            text-decoration: none;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            transition: color 0.15s, background 0.15s;
        }
        .nav-link:hover {
            color: #4f46e5;
            background: #eef2ff;
        }
        .nav-link.active {
            color: #4f46e5;
            font-weight: 600;
        }
        .nav-user {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-left: 0.5rem;
        }
        .nav-user-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }
        .nav-user-name {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1f2937;
        }
        .nav-logout-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 4px;
            border-radius: 0.375rem;
            transition: color 0.15s, background 0.15s;
            display: flex;
            align-items: center;
        }
        .nav-logout-btn:hover {
            color: #dc2626;
            background: #fef2f2;
        }
    </style>
</body>
</html>
