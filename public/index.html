<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WriteSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
        body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; height: 64px; }
        .nav-brand { font-size: 1.25rem; font-weight: 700; color: #6366f1; text-decoration: none; }
        .nav-brand:hover { color: #4f46e5; }
        .nav-links { display: flex; align-items: center; gap: 1rem; }
        .nav-link { font-size: 0.875rem; font-weight: 500; color: #4b5563; text-decoration: none; padding: 0.375rem 0.75rem; border-radius: 0.375rem; transition: background 0.15s, color 0.15s; }
        .nav-link:hover { background: #f3f4f6; color: #111827; }
        .nav-link.active { background: #eef2ff; color: #6366f1; }
        .nav-user { display: flex; align-items: center; gap: 0.75rem; }
        .nav-user-info { display: flex; flex-direction: column; align-items: flex-start; }
        .nav-user-name { font-size: 0.8rem; font-weight: 600; color: #1f2937; }
        .nav-logout-btn { background: none; border: 1px solid #e5e7eb; border-radius: 0.375rem; padding: 0.375rem; cursor: pointer; color: #6b7280; transition: color 0.15s, border-color 0.15s; }
        .nav-logout-btn:hover { color: #ef4444; border-color: #fca5a5; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <nav id="main-nav" class="bg-white border-b border-gray-200 sticky top-0 z-50"></nav>

    <main class="flex-1">
        <section class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 py-20 px-4">
            <div class="max-w-3xl mx-auto text-center">
                <h1 class="text-5xl font-extrabold text-gray-900 tracking-tight leading-tight">
                    Welcome to <span class="text-indigo-600">WriteSpace</span>
                </h1>
                <p class="mt-4 text-lg text-gray-500 max-w-xl mx-auto">
                    A clean, minimal blogging platform. Read the latest posts, share your thoughts, and connect with writers.
                </p>
                <div class="mt-8 flex items-center justify-center gap-4" id="hero-actions"></div>
            </div>
        </section>

        <section class="max-w-4xl mx-auto px-4 py-16">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-bold text-gray-900">Latest Posts</h2>
                <a href="/blogs.html" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 transition-colors">
                    View all posts &rarr;
                </a>
            </div>
            <div id="posts-container">
                <div class="flex justify-center items-center py-16">
                    <div class="w-8 h-8 border-3 border-gray-200 border-t-indigo-500 rounded-full" style="border-width:3px;animation:spin 0.8s linear infinite;"></div>
                </div>
            </div>
        </section>

        <section class="bg-white border-t border-gray-100 py-16 px-4">
            <div class="max-w-3xl mx-auto text-center">
                <h2 class="text-2xl font-bold text-gray-900">Start Writing Today</h2>
                <p class="mt-3 text-gray-500">Create an account and share your stories with the world.</p>
                <div class="mt-6" id="cta-actions"></div>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 px-4">
        <div class="max-w-4xl mx-auto text-center text-sm text-gray-400">
            &copy; 2024 WriteSpace. Built with Rust &amp; Axum.
        </div>
    </footer>

    <script src="/js/app.js"></script>
    <script>
        (function () {
            "use strict";

            App.renderNav("home");

            var loggedIn = App.isLoggedIn();
            var heroActions = document.getElementById("hero-actions");
            var ctaActions = document.getElementById("cta-actions");

            if (loggedIn) {
                heroActions.innerHTML =
                    '<a href="/new-post.html" class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow hover:bg-indigo-700 transition-colors">' +
                        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>' +
                        'New Post' +
                    '</a>' +
                    '<a href="/blogs.html" class="inline-flex items-center px-6 py-3 bg-white text-gray-700 font-semibold rounded-lg border border-gray-300 shadow-sm hover:bg-gray-50 transition-colors">' +
                        'Browse Posts' +
                    '</a>';
                ctaActions.innerHTML =
                    '<a href="/new-post.html" class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow hover:bg-indigo-700 transition-colors">' +
                        'Write a Post' +
                    '</a>';
            } else {
                heroActions.innerHTML =
                    '<a href="/register.html" class="inline-flex items-center px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow hover:bg-indigo-700 transition-colors">' +
                        'Get Started' +
                    '</a>' +
                    '<a href="/login.html" class="inline-flex items-center px-6 py-3 bg-white text-gray-700 font-semibold rounded-lg border border-gray-300 shadow-sm hover:bg-gray-50 transition-colors">' +
                        'Sign In' +
                    '</a>';
                ctaActions.innerHTML =
                    '<a href="/register.html" class="inline-flex items-center px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow hover:bg-indigo-700 transition-colors">' +
                        'Create Account' +
                    '</a>';
            }

            loadLatestPosts();

            function loadLatestPosts() {
                var container = document.getElementById("posts-container");

                App.apiFetch("/api/posts", { method: "GET" })
                    .then(function (result) {
                        var posts = result.data;
                        if (!posts || posts.length === 0) {
                            container.innerHTML =
                                '<div class="text-center py-16">' +
                                    '<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 mb-4">' +
                                        '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>' +
                                    '</div>' +
                                    '<p class="text-gray-500 text-lg font-medium">No posts yet</p>' +
                                    '<p class="text-gray-400 text-sm mt-1">Be the first to write something!</p>' +
                                '</div>';
                            return;
                        }

                        var html = '<div class="grid gap-6">';
                        for (var i = 0; i < posts.length; i++) {
                            var post = posts[i];
                            var author = post.author || {};
                            var avatar = App.renderAvatar(author.display_name || "Unknown", author.role || "user", 40);
                            var date = App.formatDate(post.created_at);

                            html +=
                                '<a href="/post.html?id=' + App.escapeHtml(post.id) + '" class="block bg-white rounded-xl border border-gray-200 p-6 shadow-sm hover:shadow-md hover:border-indigo-200 transition-all group">' +
                                    '<div class="flex items-start gap-4">' +
                                        '<div class="flex-shrink-0 mt-1">' + avatar + '</div>' +
                                        '<div class="flex-1 min-w-0">' +
                                            '<h3 class="text-lg font-semibold text-gray-900 group-hover:text-indigo-600 transition-colors truncate">' +
                                                App.escapeHtml(post.title) +
                                            '</h3>' +
                                            '<div class="mt-2 flex items-center gap-3 text-sm text-gray-500">' +
                                                '<span class="font-medium text-gray-700">' + App.escapeHtml(author.display_name || "Unknown") + '</span>' +
                                                '<span class="text-gray-300">&middot;</span>' +
                                                '<span>' + App.escapeHtml(date) + '</span>' +
                                                (author.role === "admin" ? '<span class="text-gray-300">&middot;</span>' + App.getRoleBadge(author.role) : '') +
                                            '</div>' +
                                        '</div>' +
                                        '<div class="flex-shrink-0 text-gray-300 group-hover:text-indigo-400 transition-colors">' +
                                            '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>' +
                                        '</div>' +
                                    '</div>' +
                                '</a>';
                        }
                        html += '</div>';

                        container.innerHTML = html;
                    })
                    .catch(function (err) {
                        var message = (err && err.error) ? err.error : "Failed to load posts";
                        container.innerHTML =
                            '<div class="text-center py-16">' +
                                '<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-50 mb-4">' +
                                    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
                                '</div>' +
                                '<p class="text-red-600 font-medium">' + App.escapeHtml(message) + '</p>' +
                                '<button onclick="location.reload()" class="mt-4 px-4 py-2 text-sm font-medium text-indigo-600 bg-indigo-50 rounded-lg hover:bg-indigo-100 transition-colors">Try Again</button>' +
                            '</div>';
                    });
            }
        })();
    </script>
</body>
</html>
