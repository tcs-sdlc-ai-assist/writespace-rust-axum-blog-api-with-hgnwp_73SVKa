<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write — WriteSpace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/app.js"></script>
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <nav id="main-nav" class="bg-white border-b border-gray-200 px-4 py-3 sticky top-0 z-50">
        <style>
            .nav-inner { display:flex; align-items:center; justify-content:space-between; max-width:1100px; margin:0 auto; }
            .nav-brand { font-size:1.3rem; font-weight:800; color:#6366f1; text-decoration:none; }
            .nav-links { display:flex; align-items:center; gap:12px; }
            .nav-link { font-size:0.95rem; color:#4b5563; text-decoration:none; padding:4px 10px; border-radius:6px; transition:background 0.15s,color 0.15s; }
            .nav-link:hover, .nav-link.active { background:#eef2ff; color:#6366f1; }
            .nav-user { display:flex; align-items:center; gap:8px; margin-left:12px; }
            .nav-user-info { display:flex; flex-direction:column; align-items:flex-start; }
            .nav-user-name { font-size:0.85rem; font-weight:600; color:#1f2937; }
            .nav-logout-btn { background:none; border:none; color:#9ca3af; cursor:pointer; padding:4px; border-radius:6px; transition:color 0.15s,background 0.15s; }
            .nav-logout-btn:hover { color:#ef4444; background:#fef2f2; }
        </style>
    </nav>

    <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-8">
        <div id="page-loading" class="flex justify-center items-center py-20">
            <div class="w-8 h-8 border-4 border-gray-200 border-t-indigo-500 rounded-full" style="animation:spin 0.8s linear infinite;"></div>
        </div>

        <div id="page-content" class="hidden">
            <div class="mb-8">
                <h1 id="page-title" class="text-3xl font-bold text-gray-900">Create New Post</h1>
                <p id="page-subtitle" class="mt-1 text-gray-500 text-sm">Share your thoughts with the world.</p>
            </div>

            <form id="post-form" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6">
                <div>
                    <label for="title" class="block text-sm font-semibold text-gray-700 mb-1">Title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        maxlength="200"
                        required
                        placeholder="Enter your post title..."
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                    />
                    <p class="mt-1 text-xs text-gray-400"><span id="title-count">0</span>/200 characters</p>
                </div>

                <div>
                    <label for="content" class="block text-sm font-semibold text-gray-700 mb-1">Content</label>
                    <textarea
                        id="content"
                        name="content"
                        rows="14"
                        required
                        placeholder="Write your post content here..."
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition resize-y"
                    ></textarea>
                </div>

                <div id="form-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-3"></div>

                <div class="flex items-center justify-between pt-2">
                    <a href="/blogs.html" class="text-sm text-gray-500 hover:text-gray-700 transition">← Back to posts</a>
                    <div class="flex items-center gap-3">
                        <button
                            type="button"
                            id="cancel-btn"
                            onclick="window.history.back()"
                            class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition"
                        >
                            Cancel
                        </button>
                        <button
                            type="submit"
                            id="submit-btn"
                            class="px-6 py-2.5 text-sm font-semibold text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            Publish Post
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <div id="page-error" class="hidden text-center py-20">
            <p class="text-lg font-semibold text-red-600">Error</p>
            <p id="error-message" class="mt-2 text-gray-500"></p>
            <a href="/blogs.html" class="inline-block mt-4 text-indigo-600 hover:text-indigo-700 text-sm font-medium">← Back to posts</a>
        </div>
    </main>

    <footer class="border-t border-gray-200 bg-white py-6 mt-auto">
        <div class="max-w-3xl mx-auto px-4 text-center text-sm text-gray-400">
            &copy; 2024 WriteSpace. All rights reserved.
        </div>
    </footer>

    <script>
    (function () {
        "use strict";

        if (!App.requireAuth()) return;

        App.renderNav("new-post");

        var titleInput = document.getElementById("title");
        var contentInput = document.getElementById("content");
        var form = document.getElementById("post-form");
        var submitBtn = document.getElementById("submit-btn");
        var formError = document.getElementById("form-error");
        var pageLoading = document.getElementById("page-loading");
        var pageContent = document.getElementById("page-content");
        var pageError = document.getElementById("page-error");
        var errorMessage = document.getElementById("error-message");
        var pageTitle = document.getElementById("page-title");
        var pageSubtitle = document.getElementById("page-subtitle");
        var titleCount = document.getElementById("title-count");

        var params = new URLSearchParams(window.location.search);
        var postId = params.get("id");
        var isEditing = !!postId;

        titleInput.addEventListener("input", function () {
            titleCount.textContent = titleInput.value.length;
        });

        function showFormError(msg) {
            formError.textContent = msg;
            formError.classList.remove("hidden");
        }

        function hideFormError() {
            formError.classList.add("hidden");
            formError.textContent = "";
        }

        function setSubmitting(submitting) {
            submitBtn.disabled = submitting;
            if (submitting) {
                submitBtn.innerHTML =
                    '<span class="inline-flex items-center gap-2">' +
                    '<span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full inline-block" style="animation:spin 0.8s linear infinite;"></span>' +
                    (isEditing ? "Saving..." : "Publishing...") +
                    "</span>";
            } else {
                submitBtn.textContent = isEditing ? "Save Changes" : "Publish Post";
            }
        }

        function showPage() {
            pageLoading.classList.add("hidden");
            pageContent.classList.remove("hidden");
        }

        function showPageError(msg) {
            pageLoading.classList.add("hidden");
            pageContent.classList.add("hidden");
            pageError.classList.remove("hidden");
            errorMessage.textContent = msg;
        }

        function loadPost() {
            if (!isEditing) {
                showPage();
                titleInput.focus();
                return;
            }

            pageTitle.textContent = "Edit Post";
            pageSubtitle.textContent = "Update your post content.";
            submitBtn.textContent = "Save Changes";
            document.title = "Edit Post — WriteSpace";

            App.apiFetch("/api/posts/" + postId)
                .then(function (result) {
                    var post = result.data;

                    var user = App.getUser();
                    var canEdit = false;
                    if (user) {
                        canEdit = user.role === "admin" || user.sub === post.author.id;
                    }

                    if (!canEdit) {
                        showPageError("You are not authorized to edit this post.");
                        return;
                    }

                    titleInput.value = post.title || "";
                    contentInput.value = post.content || "";
                    titleCount.textContent = titleInput.value.length;
                    showPage();
                    titleInput.focus();
                })
                .catch(function (err) {
                    var msg = "Failed to load post.";
                    if (err && err.status === 404) {
                        msg = "Post not found.";
                    } else if (err && err.error) {
                        msg = err.error;
                    }
                    showPageError(msg);
                });
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            hideFormError();

            var title = titleInput.value.trim();
            var content = contentInput.value.trim();

            if (!title) {
                showFormError("Title is required.");
                titleInput.focus();
                return;
            }

            if (title.length > 200) {
                showFormError("Title must be at most 200 characters.");
                titleInput.focus();
                return;
            }

            if (!content) {
                showFormError("Content is required.");
                contentInput.focus();
                return;
            }

            setSubmitting(true);

            var url = isEditing ? "/api/posts/" + postId : "/api/posts";
            var method = isEditing ? "PUT" : "POST";

            App.apiFetch(url, {
                method: method,
                body: { title: title, content: content },
            })
                .then(function (result) {
                    var savedPost = result.data;
                    App.showToast(
                        isEditing ? "Post updated successfully!" : "Post published successfully!",
                        "success"
                    );
                    if (savedPost && savedPost.id) {
                        window.location.href = "/post.html?id=" + savedPost.id;
                    } else {
                        window.location.href = "/blogs.html";
                    }
                })
                .catch(function (err) {
                    var msg = "Something went wrong. Please try again.";
                    if (err && err.error) {
                        msg = err.error;
                    }
                    showFormError(msg);
                    setSubmitting(false);
                });
        });

        loadPost();
    })();
    </script>
</body>
</html>
